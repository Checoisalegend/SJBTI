<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>世界杯人格测试</title>
    <meta
      name="description"
      content="测测你的世界杯人格，看看你最像哪一种球员。"
    />
    <meta name="theme-color" content="#f2f4ef" />
    <meta name="robots" content="index, follow" />
    <link rel="stylesheet" href="./styles.css?v=20260629a" />
  </head>
  <body>
    <main class="app-shell">
      <section id="screen-intro" class="screen is-active">
        <div class="intro-minimal">
          <header class="intro-brand" aria-label="网站名称">
            <span class="intro-brand-mark">SJBTI</span>
            <span class="intro-brand-name">世界杯成分鉴定器</span>
          </header>
          <div class="intro-copy">
            <h1 id="introTitle">看世界杯前，请先验明成分</h1>
            <p class="intro-subtitle">测测你的世界杯人格</p>
          </div>
          <button class="primary-btn intro-start-btn" id="startBtn">开始测试</button>
          <footer class="intro-footer">
            <span>sjbti.xyz</span>
            <span class="intro-footer-divider" aria-hidden="true"></span>
            <span>Made by Lokki</span>
          </footer>
        </div>
      </section>

      <section id="screen-test" class="screen">
        <div class="test-card">
          <div class="question-progress">
            <div class="counter" id="counter">1 / 1</div>
            <div class="progress-track">
              <span id="progressBar"></span>
            </div>
          </div>
          <div class="answer-mode-switch" id="answerModeSwitch" hidden>
            <span class="answer-mode-label">答题模式</span>
            <div class="answer-mode-options" role="group" aria-label="答题选项数量">
              <button type="button" data-answer-mode="quick">3项粗略</button>
              <button type="button" data-answer-mode="precise">5项精准</button>
            </div>
          </div>
          <h2 class="question-title" id="questionTitle">问题会显示在这里</h2>
          <div class="options" id="options"></div>
          <div class="test-actions">
            <button class="ghost-btn" id="prevBtn">上一题</button>
            <button class="secondary-btn" id="restartMiniBtn">重新开始</button>
          </div>
        </div>
      </section>

      <section id="screen-result" class="screen">
        <div class="result-shell">
          <div class="result-card" id="resultCard">
            <div class="card-placeholder" id="cardPlaceholder">
              <img id="resultCardImage" alt="" />
            </div>
          </div>

          <div class="result-explanation">
            <div class="result-facts">
              <p>你的人格类型是：<strong id="resultDetailName"></strong></p>
              <p id="resultPlayerRow">
                对应的球员是：<strong id="resultPlayerChinese"></strong>
              </p>
            </div>
            <p class="result-description" id="resultDescription"></p>
            <div class="description-feedback" id="descriptionFeedback" hidden>
              <button type="button" class="feedback-btn" id="feedbackLikeBtn">
                <span class="feedback-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <path d="M7 10v10" />
                    <path d="M7 19H5.5A2.5 2.5 0 0 1 3 16.5v-4A2.5 2.5 0 0 1 5.5 10H7" />
                    <path d="M7 10l4.4-6.1a1.8 1.8 0 0 1 3.2 1.4L13.8 9H18a2.6 2.6 0 0 1 2.5 3.2l-1.3 5.4A3 3 0 0 1 16.3 20H7" />
                  </svg>
                </span>
                <span class="feedback-label">是的这就是我</span>
              </button>
              <button type="button" class="feedback-btn" id="feedbackDislikeBtn">
                <span class="feedback-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <path d="M7 14V4" />
                    <path d="M7 5H5.5A2.5 2.5 0 0 0 3 7.5v4A2.5 2.5 0 0 0 5.5 14H7" />
                    <path d="M7 14l4.4 6.1a1.8 1.8 0 0 0 3.2-1.4l-.8-3.7H18a2.6 2.6 0 0 0 2.5-3.2l-1.3-5.4A3 3 0 0 0 16.3 4H7" />
                  </svg>
                </span>
                <span class="feedback-label">我不要面子？</span>
              </button>
            </div>
          </div>

          <div class="dimension-results" id="dimensionBars"></div>

          <div class="result-actions">
            <button class="secondary-btn" id="restartBtn">再测一次</button>
            <button class="secondary-btn" id="shareBtn">分享网址</button>
            <button class="primary-btn" id="saveBtn">保存结果</button>
          </div>
        </div>
      </section>
    </main>

    <script src="./data.js?v=20260629a"></script>
    <script src="./copy.js?v=20260629a"></script>
    <script src="./app.js?v=20260629a"></script>
  </body>
</html>
